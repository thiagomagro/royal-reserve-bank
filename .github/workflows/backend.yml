name: Backend

on:
  push:
    paths-ignore:
      - "web/**"
      - "docs/**"
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "web/**"
      - "docs/**"
      - "**/*.md"

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: mvn --batch-mode clean verify
