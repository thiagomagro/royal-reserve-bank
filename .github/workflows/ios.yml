name: iOS
on:
  push:
    paths: ['mobile/ios/**', '.github/workflows/ios.yml']
  pull_request:
    paths: ['mobile/ios/**', '.github/workflows/ios.yml']
jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check localization
        run: python3 mobile/ios/scripts/check_localization.py
      - name: Select available iPhone simulator
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; devices=json.load(sys.stdin)["devices"]; print(next(d["udid"] for runtime, rows in devices.items() if "iOS" in runtime for d in rows if "iPhone" in d["name"]))')
          echo "DEVICE_ID=$DEVICE_ID" >> "$GITHUB_ENV"
      - name: Test
        working-directory: mobile/ios
        run: xcodebuild -project RoyalReserveBank.xcodeproj -scheme RoyalReserveBank -destination "platform=iOS Simulator,id=$DEVICE_ID" CODE_SIGNING_ALLOWED=NO test
