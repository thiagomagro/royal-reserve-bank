server.port=4000
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=root
spring.datasource.password=admin
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
eureka.client.serviceUrl.defaultZone=http://eureka:password@localhost:8761/eureka
management.tracing.sampling.probability=1

#Circular Breaker Properties
management.health.circuitbreakers.enabled=true
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

#Resilience4j Properties (instance name must match @CircuitBreaker/@TimeLimiter/@Retry name="asset-management")
resilience4j.circuitbreaker.instances.asset-management.register-health-indicator=true
resilience4j.circuitbreaker.instances.asset-management.event-consumer-buffer-size=10
resilience4j.circuitbreaker.instances.asset-management.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.asset-management.sliding-window-size=5
resilience4j.circuitbreaker.instances.asset-management.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.asset-management.wait-duration-in-open-state=5s
resilience4j.circuitbreaker.instances.asset-management.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.asset-management.automatic-transition-from-open-to-half-open-enabled=true

#Resilience4J Timeout And Retry Properties
resilience4j.timelimiter.instances.asset-management.timeout-duration=3s
resilience4j.retry.instances.asset-management.max-attempts=3
resilience4j.retry.instances.asset-management.wait-duration=5s

# Kafka Properties
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.template.default-topic=notificationTopic
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.type.mapping=event:com.royal.reserve.bank.transaction.api.event.TransactionEvent

spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.cache.redis.time-to-live=300s
spring.data.redis.lettuce.pool.enabled=true
spring.data.redis.lettuce.pool.max-active=10
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=2
